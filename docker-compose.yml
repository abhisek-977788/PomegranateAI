version: '3.9'

# MongoDB Atlas is used as the database (cloud-hosted).
# No local mongodb container needed.

services:
  # ── ML Inference Service ─────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: pomegranate_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WEIGHTS_DIR=/weights
      - DEVICE=auto
    volumes:
      - ./weights:/weights:ro
    networks: [pom-net]
    # Uncomment for NVIDIA GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ── Express.js Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pomegranate_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env                        # Loads MONGO_URI and all other vars
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      ml-service:
        condition: service_healthy
    networks: [pom-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api          # Nginx proxy: /api -> backend:5000
    container_name: pomegranate_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [pom-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  pom-net:
    driver: bridge
