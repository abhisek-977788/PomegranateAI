services:
  - type: web
    name: pomegranate-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml_service.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEIGHTS_DIR
        value: ./weights
